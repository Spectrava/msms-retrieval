[project]
name = "sna"
version = "0.1.0"
description = "Separability Is Not Alignability: spectrum-to-molecule retrieval experiments"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
# The encoder and the MS2 scripts need only these; the MassSpecGym training harness needs the extras.
dependencies = ["torch>=2.4", "numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
train = ["rdkit>=2024.3.1", "transformers>=4.40", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sna", "sna.encoders"]

[project.scripts]
sna = "sna.cli:main"
